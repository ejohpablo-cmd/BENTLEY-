<!DOCTYPE html>
<html lang="en" data-theme="light" data-bubble="rounded" data-tab="chat" data-screen="auth">
<head>
  <meta charset="UTF-8">
  <!-- interactive-widget: the on-screen keyboard overlays the page instead of squeezing it -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="theme-color" content="#FAF7FF">
  <meta name="color-scheme" content="light dark">
  <title>Axelvon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="theme-init.js"></script>
</head>
<body>
  <!-- Chat wallpaper: fixed in place, so the keyboard never moves or resizes it -->
  <div id="chat-bg" class="chat-bg" aria-hidden="true"></div>

  <div id="config-error" class="config-error hidden" role="alert">
    Add your Supabase URL and anon key in config.js to continue.
  </div>

  <!-- Sign in / create account -->
  <main id="auth-screen" class="auth hidden">
    <!-- Your looping background video: add a file named video.mp4 next to this page -->
    <video id="auth-video" class="auth-video" src="video.mp4" autoplay muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
    <div class="auth-card">
      <img class="avatar axelvon-img lg" src="benny.png" alt="Axelvon" width="96" height="96">
      <h1 class="auth-title">Axelvon</h1>
      <p class="muted" id="auth-subtitle">Sign in to talk to Axelvon</p>

      <button class="btn google-btn" id="google-btn" type="button">
        <svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        <span id="google-btn-label">Continue with Google</span>
      </button>
      <div class="divider"><span>or</span></div>

      <form id="auth-form" class="auth-form">
        <label class="field">
          <span>Email</span>
          <input id="auth-email" type="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input id="auth-password" type="password" autocomplete="current-password" minlength="6" required>
        </label>
        <p id="auth-message" class="auth-message" role="alert"></p>
        <button class="btn" id="auth-submit" type="submit">Sign in</button>
      </form>
      <button class="link-btn" id="auth-toggle" type="button">New here? Create an account</button>
    </div>
  </main>

  <div id="app" class="app hidden">

    <!-- Chat -->
    <section id="page-chat" class="page active" aria-label="Chat">
      <header class="topbar">
        <div class="topbar-id">
          <img class="avatar axelvon-img sm" src="benny.png" alt="Axelvon" width="40" height="40">
          <div>
            <h1 class="topbar-title">Axelvon</h1>
            <p class="status"><span class="status-dot"></span>Your Lovely Angel</p>
          </div>
        </div>
        <button id="new-chat-btn" class="icon-btn topbar-action" type="button" aria-label="New chat">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
      </header>

      <div id="messages" class="messages" role="log" aria-live="polite"></div>

      <!-- Shown while Axelvon is resting after the limit was reached -->
      <div id="rest-banner" class="rest-banner hidden" role="status">
        <strong>Axelvon is resting</strong>
        <span>You can chat again in <b id="rest-timer">01:30:00</b></span>
      </div>

      <div id="edit-bar" class="edit-bar hidden">
        <span>Editing your message</span>
        <button id="cancel-edit-btn" class="icon-btn small" type="button" aria-label="Cancel editing">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div id="photo-strip" class="photo-strip hidden" aria-label="Photos to send"></div>

      <form id="composer" class="composer" autocomplete="off">
        <div class="composer-box">
          <button type="button" id="attach-btn" class="attach-btn" aria-label="Add a photo">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <textarea id="chat-input" rows="1" placeholder="Talk to Axelvon" maxlength="4000" aria-label="Message Axelvon"></textarea>
        </div>
        <button type="submit" id="send-btn" class="send-btn" aria-label="Send message" disabled>
          <svg id="send-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <svg id="stop-icon" class="hidden" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
        </button>
      </form>
      <!-- Hidden pickers opened by the + button: camera and gallery -->
      <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
      <input id="gallery-input" type="file" accept="image/*" multiple hidden>
    </section>

    <!-- History -->
    <section id="page-history" class="page" aria-label="History">
      <header class="topbar"><h1 class="page-title">History</h1></header>
      <div id="history-list" class="page-scroll"></div>
    </section>

    <!-- Settings -->
    <section id="page-settings" class="page" aria-label="Settings">
      <header class="topbar"><h1 class="page-title">Settings</h1></header>
      <div id="settings-root" class="page-scroll"></div>
    </section>

    <!-- Profile -->
    <section id="page-profile" class="page" aria-label="Profile">
      <header class="topbar"><h1 class="page-title">Profile</h1></header>
      <div id="profile-root" class="page-scroll"></div>
    </section>

    <nav class="bottom-nav" aria-label="Main">
      <button class="nav-btn active" type="button" data-tab="chat" aria-current="page">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        <span>Chat</span>
      </button>
      <button class="nav-btn" type="button" data-tab="history">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>History</span>
      </button>
      <button class="nav-btn" type="button" data-tab="settings">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        <span>Settings</span>
      </button>
      <button class="nav-btn" type="button" data-tab="profile">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <!-- Pop-up sheet used for menus, forms and confirmations -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sheet">
      <h2 id="modal-title" class="sheet-title"></h2>
      <div id="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <!-- Full-screen picture viewer: opens on this page, with a download button -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Picture viewer">
    <div class="lightbox-bar">
      <button id="lightbox-download" class="btn sm primary" type="button">Download</button>
      <button id="lightbox-close" class="icon-btn lightbox-close" type="button" aria-label="Close picture">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <img id="lightbox-image" class="lightbox-image" alt="Picture">
  </div>

  <!-- App lock screen (only used when App lock is turned on in Settings) -->
  <div id="lock-screen" class="lock hidden" role="dialog" aria-modal="true" aria-label="App locked">
    <div class="lock-card">
      <img class="avatar axelvon-img lg" src="benny.png" alt="Axelvon" width="96" height="96">
      <h2 class="lock-title">Axelvon is locked</h2>
      <p class="muted" id="lock-hint">Enter your PIN</p>
      <form id="lock-form" class="lock-form">
        <input id="lock-pin" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="PIN">
        <p id="lock-error" class="form-error" role="alert"></p>
        <button class="btn" type="submit">Unlock</button>
      </form>
      <button id="lock-signout" class="link-btn" type="button">Forgot PIN? Sign out</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
